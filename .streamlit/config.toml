[theme]
base = "light"
primaryColor = "#0F8F8D"
backgroundColor = "#F6F8FB"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#10233F"
linkColor = "#0F6CBD"
borderColor = "#DDE4EC"
dataframeBorderColor = "#DDE4EC"
